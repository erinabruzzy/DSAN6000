[project]
name = "dsan6000-nyc-shelters"
version = "0.1.0"
description = "NYC homeless shelter data pipeline and dashboard (DSAN6000 final project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Must match the Spark install on the EC2 cluster (~/spark is 4.3.0).
    "pyspark==4.3.0",
    # PySpark 4.3 warns that pandas >= 3 is not fully supported.
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "streamlit>=1.50,<2",  # st.context.theme, width="stretch"
    "altair>=5.4,<7",
]

[dependency-groups]
# Installed by default with `uv sync`; skip with `uv sync --no-dev`.
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pytest>=8",
    "seaborn>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
